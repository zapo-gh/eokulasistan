<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      width: 320px;
      background: #0f1117;
      color: #e2e8f0;
    }

    /* ── Header ── */
    .header {
      background: linear-gradient(135deg, #1a1f2e 0%, #16213e 100%);
      padding: 16px 18px 14px;
      border-bottom: 1px solid #2d3748;
    }
    .header h3 {
      font-size: 15px;
      font-weight: 700;
      color: #63b3ed;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .header p {
      font-size: 11px;
      color: #718096;
      margin-top: 5px;
    }

    /* ── Sections ── */
    .section {
      padding: 14px 16px;
      border-bottom: 1px solid #1e2535;
    }
    .section-title {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1px;
      color: #4a5568;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    /* ── PDF Yükleme ── */
    .upload-zone {
      border: 2px dashed #2d3748;
      border-radius: 10px;
      padding: 14px 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s;
      background: #141824;
      position: relative;
    }
    .upload-zone:hover {
      border-color: #4299e1;
      background: #162032;
    }
    .upload-zone.has-file {
      border-color: #38a169;
      background: #0d1f15;
    }
    .upload-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }
    .upload-icon { font-size: 22px; margin-bottom: 5px; }
    .upload-text { font-size: 12px; color: #718096; }
    .upload-text strong { color: #a0aec0; display: block; margin-top: 2px; font-size: 11px; }

    /* ── Status badge ── */
    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 8px;
      background: #141824;
      margin-top: 10px;
      min-height: 34px;
    }
    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .status-dot.gray  { background: #4a5568; }
    .status-dot.blue  { background: #4299e1; animation: pulse 1.2s infinite; }
    .status-dot.green { background: #48bb78; }
    .status-dot.red   { background: #fc8181; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

    .status-text { font-size: 11px; color: #a0aec0; flex: 1; line-height: 1.4; }

    /* ── Şube bilgisi ── */
    .sube-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border-radius: 8px;
      background: #141824;
      font-size: 11px;
    }
    .sube-label { color: #718096; }
    .sube-name  { color: #63b3ed; font-weight: 600; font-size: 12px; }
    .sube-count { color: #68d391; font-size: 10px; }

    /* ── Butonlar ── */
    .btn {
      width: 100%;
      padding: 10px 14px;
      margin-bottom: 8px;
      border: none;
      border-radius: 9px;
      font-weight: 600;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: 0.2px;
    }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn:last-child { margin-bottom: 0; }

    .btn-analyze {
      background: linear-gradient(135deg, #2b6cb0 0%, #2c5282 100%);
      color: #bee3f8;
      border: 1px solid #2d7dd2;
    }
    .btn-analyze:hover:not(:disabled) {
      background: linear-gradient(135deg, #3182ce 0%, #2b6cb0 100%);
      transform: translateY(-1px);
    }

    .btn-verify {
      background: linear-gradient(135deg, #553c9a 0%, #44337a 100%);
      color: #d6bcfa;
      border: 1px solid #6b46c1;
    }
    .btn-verify:hover:not(:disabled) {
      background: linear-gradient(135deg, #6b46c1 0%, #553c9a 100%);
      transform: translateY(-1px);
    }

    .btn-ogretmen {
      background: linear-gradient(135deg, #276749 0%, #22543d 100%);
      color: #9ae6b4;
      border: 1px solid #2f855a;
    }
    .btn-ogretmen:hover:not(:disabled) {
      background: linear-gradient(135deg, #2f855a 0%, #276749 100%);
      transform: translateY(-1px);
    }

    .btn-haftalik {
      background: linear-gradient(135deg, #744210 0%, #5f370e 100%);
      color: #fbd38d;
      border: 1px solid #975a16;
    }
    .btn-haftalik:hover:not(:disabled) {
      background: linear-gradient(135deg, #975a16 0%, #744210 100%);
      transform: translateY(-1px);
    }

    .btn-ekders {
      background: linear-gradient(135deg, #047857 0%, #065f46 100%);
      color: #a7f3d0;
      border: 1px solid #059669;
    }
    .btn-ekders:hover:not(:disabled) {
      background: linear-gradient(135deg, #059669 0%, #047857 100%);
      transform: translateY(-1px);
    }

    .btn-reset {
      background: linear-gradient(135deg, #742a2a 0%, #63171b 100%);
      color: #feb2b2;
      border: 1px solid #9b2c2c;
    }
    .btn-reset:hover:not(:disabled) {
      background: linear-gradient(135deg, #9b2c2c 0%, #742a2a 100%);
      transform: translateY(-1px);
    }

    /* ── Şube listesi ── */
    #subeListesi {
      max-height: 120px;
      overflow-y: auto;
      margin-top: 8px;
    }
    #subeListesi::-webkit-scrollbar { width: 4px; }
    #subeListesi::-webkit-scrollbar-track { background: #141824; }
    #subeListesi::-webkit-scrollbar-thumb { background: #2d3748; border-radius: 4px; }

    .sube-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 10px;
      border-radius: 6px;
      margin-bottom: 3px;
      background: #141824;
      font-size: 11px;
    }
    .sube-item-name { color: #63b3ed; font-weight: 600; }
    .sube-item-detail { color: #718096; }

    .divider {
      border: none;
      border-top: 1px solid #1e2535;
      margin: 0;
    }

    /* ── Footer ── */
    .footer {
      padding: 10px 16px;
      font-size: 10px;
      color: #2d3748;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="header">
    <h3>⚡ e-Okul Asistanı <span style="color:#4a5568;font-size:10px;font-weight:400">v2.0</span></h3>
    <p>PDF yükleyerek tüm işlemleri otomatik yapın</p>
  </div>

  <!-- PDF Yükleme -->
  <div class="section">
    <div class="section-title">📄 PDF Analizi</div>
    <div class="upload-zone" id="uploadZone">
      <input type="file" id="pdfDosya" accept=".pdf" />
      <div class="upload-icon" id="uploadIcon">📑</div>
      <div class="upload-text">
        SinifProgrami.pdf seçin
        <strong>Sürükleyin veya tıklayın</strong>
      </div>
    </div>

    <button class="btn btn-analyze" id="btnAnaliz" disabled>
      🔍 PDF'i Analiz Et
    </button>

    <div class="status-row">
      <div class="status-dot gray" id="statusDot"></div>
      <div class="status-text" id="statusText">PDF seçilmedi</div>
    </div>
  </div>

  <!-- Yüklenen Şubeler -->
  <div class="section" id="subeSection" style="display:none">
    <div class="section-title">📚 Yüklenen Şubeler</div>
    <div id="subeListesi"></div>
  </div>

  <hr class="divider">

  <!-- İşlem Butonları -->
  <div class="section">
    <div class="section-title">⚙️ e-Okul İşlemleri</div>
    
    <div id="subeSecimAlani" style="margin-bottom: 12px; display: none;">
      <label for="subeManuelSecici" style="font-size: 11px; color: #a0aec0; margin-bottom: 4px; display: block;">Hangi program uygulansın?</label>
      <select id="subeManuelSecici" style="width: 100%; padding: 6px; border-radius: 4px; background: #1a202c; color: #e2e8f0; border: 1px solid #4a5568; font-size: 11px; outline: none;">
        <option value="">(Otomatik Algıla)</option>
      </select>
    </div>

    <div id="subeAktif" class="sube-info" style="display:none;margin-bottom:10px;">
      <span class="sube-label">Aktif şube:</span>
      <span class="sube-name" id="subeAktifAdi">—</span>
    </div>
    <button class="btn btn-verify" id="btnDogrula" disabled>
      🔗 Eşleştirmeyi Doğrula
    </button>
    <button class="btn btn-ogretmen" id="btnOgretmenAta" disabled>
      👨‍🏫 Öğretmenleri Otomatik Ata
    </button>
    <button class="btn btn-haftalik" id="btnHaftalikDoldur" disabled>
      📅 Haftalık Tabloyu Doldur
    </button>
    <button class="btn btn-ekders" id="btnEkDersDoldur" disabled>
      ☑️ Seçmeli ve Ortak Dersleri İşaretle
    </button>
    <button class="btn btn-reset" id="btnSifirla">
      🛑 Döngüyü Durdur / Sıfırla
    </button>
  </div>

  <div class="footer">e-Okul Yabil Ders Programı Asistanı — PDF Destekli</div>

  <script src="utils.js"></script>
  <script src="popup.js"></script>
</body>
</html>
